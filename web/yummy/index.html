<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YummyAnime — ТВ</title><link rel="stylesheet" href="tv.css?v=11"></head>
<body>
<header><img src="../yummyanime-logo.png" alt=""><h1>YummyAnime</h1><button id="back">Назад</button><form id="searchForm"><input id="query" aria-label="Название аниме" placeholder="Название аниме" autocomplete="off"><button type="submit">Найти</button></form><nav aria-label="Разделы"><button id="catalog">Каталог</button><button id="top">Топ-100</button><button id="random">Случайное</button></nav></header>
<main id="main"><p id="status" role="status"></p><h2 id="heading">Каталог</h2><p id="description"></p><div id="grid"></div><article id="releaseCard" hidden aria-labelledby="releaseTitle"><img id="releasePoster" alt="" hidden><div class="release-info"><h2 id="releaseTitle"></h2><p id="releaseMeta" hidden></p><p id="rating" hidden></p><p id="synopsis" hidden></p></div></article><button id="more" hidden>Показать ещё</button></main>

<script src="tv.js?v=10"></script></body></html>
